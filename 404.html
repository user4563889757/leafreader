<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Page not found — Leafreader</title>
    <meta name="robots" content="noindex">
    <meta name="referrer" content="no-referrer">
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; img-src 'self' data:; base-uri 'none'; form-action 'none'"
    >
    <style>
      :root {
        --bg: #f6f1e7; --ink: #24221c; --muted: #6c6659;
        --accent: #2f6b4f; --accent-ink: #f7f3ea; --line: #cfc4b0;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #14140f; --ink: #ece6d8; --muted: #a39b8a;
          --accent: #83c9a6; --accent-ink: #10231a; --line: #464334;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center;
        padding: 24px; background: var(--bg); color: var(--ink);
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        text-align: center;
      }
      .eyebrow {
        margin: 0 0 1rem; color: var(--accent); font-family: ui-monospace, Menlo, Consolas, monospace;
        font-size: 0.7rem; letter-spacing: 0.16em; text-transform: uppercase;
      }
      h1 {
        margin: 0 0 1rem; font-family: "Iowan Old Style", Palatino, Georgia, serif;
        font-size: clamp(2.4rem, 7vw, 4.4rem); font-weight: 500;
        line-height: 1.02; letter-spacing: -0.03em;
      }
      p { max-width: 46ch; margin: 0 auto 2rem; color: var(--muted); line-height: 1.6; }
      a {
        display: inline-block; padding: 0.78rem 1.4rem; border: 1px solid var(--accent);
        border-radius: 999px; background: var(--accent); color: var(--accent-ink);
        font-size: 0.92rem; font-weight: 600; text-decoration: none;
      }
      a:hover { outline: 2px solid var(--line); outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">404</p>
      <h1>This page is missing.</h1>
      <p>The chapter may have moved, or the link may belong to a book that was never imported.</p>
      <a href="./">Back to the library</a>
    </main>
  </body>
</html>
